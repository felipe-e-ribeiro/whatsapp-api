name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Pytest (coverage >= 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          # src/links_*.py build their boto3 clients at import time with no
          # region_name (fine in Lambda, where AWS_REGION is always set for
          # us). Tests run entirely against moto, so this never talks to
          # real AWS - it only needs to resolve an endpoint. Sourced from
          # the repo secret instead of a literal so this public repo's
          # workflow file doesn't say which region the stack deploys to.
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: pytest

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit against src/
        run: bandit -r src -ll

  template:
    name: Validate SAM template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2

      - name: sam validate --lint
        run: sam validate --lint
