Comment: >
  WhatsApp Link API v3 — orchestrated number-to-link pipeline
  (Checkpoint 3). Validates the submitted number, resolves it to a
  wa.me deep link, and persists the outcome, with per-step retry and a
  dead-letter path on exhausted retries. This file is the single
  structured definition of the flow — the AWS-native equivalent of a
  Google Cloud Workflows YAML definition.
StartAt: Validate
States:
  Validate:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    Parameters:
      FunctionName: "${ValidateFunctionArn}"
      Payload.$: "$"
    ResultPath: "$.validation"
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 2
        BackoffRate: 2.0
    Catch:
      - ErrorEquals:
          - States.ALL
        ResultPath: "$.error"
        Next: HandleFailure
    Next: CheckValidation

  CheckValidation:
    Type: Choice
    Choices:
      - Variable: "$.validation.Payload.valid"
        BooleanEquals: true
        Next: Resolve
    Default: PersistInvalid

  PersistInvalid:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    Parameters:
      FunctionName: "${PersistFunctionArn}"
      Payload:
        requestId.$: "$.requestId"
        status: invalid
    End: true

  Resolve:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    Parameters:
      FunctionName: "${ResolveFunctionArn}"
      Payload.$: "$"
    ResultPath: "$.resolution"
    Retry:
      - ErrorEquals:
          - TransientResolutionError
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 2
        MaxAttempts: 3
        BackoffRate: 2.0
    Catch:
      - ErrorEquals:
          - States.ALL
        ResultPath: "$.error"
        Next: HandleFailure
    Next: PersistCompleted

  PersistCompleted:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    Parameters:
      FunctionName: "${PersistFunctionArn}"
      Payload:
        requestId.$: "$.requestId"
        status: completed
        result.$: "$.resolution.Payload.result"
    End: true

  HandleFailure:
    Type: Task
    Resource: arn:aws:states:::sqs:sendMessage
    Parameters:
      QueueUrl: "${DlqUrl}"
      MessageBody.$: "States.JsonToString($)"
    ResultPath: "$.dlq"
    Next: PersistFailed

  PersistFailed:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    Parameters:
      FunctionName: "${PersistFunctionArn}"
      Payload:
        requestId.$: "$.requestId"
        status: failed
        lastError.$: "$.error.Cause"
    Next: Fail

  Fail:
    Type: Fail
    Error: PipelineFailed
    Cause: Resolution failed after exhausting retries; payload sent to the dead-letter queue.
